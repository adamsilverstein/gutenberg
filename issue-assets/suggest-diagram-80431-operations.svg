<svg xmlns="http://www.w3.org/2000/svg" width="880" height="580" viewBox="0 0 880 580" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="880" height="580" rx="10" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,1 L7,4.5 L0,8 z" fill="#8c959f"/>
    </marker>
  </defs>

  <text x="36" y="40" font-size="18" font-weight="700" fill="#1f2328">Inline suggestion operations</text>
  <text x="36" y="63" font-size="13" fill="#59636e">Pure transforms on a rich-text value. Every one takes a value in and returns a new value out.</text>

  <!-- column 1: write -->
  <rect x="36" y="88" width="256" height="212" rx="8" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="52" y="114" font-size="14" font-weight="700" fill="#0a3069">1. Write a marker</text>
  <text x="52" y="134" font-size="12" fill="#0a3069">The user is editing in Suggest mode.</text>
  <text x="52" y="160" font-size="12.5" font-family="ui-monospace, Menlo, monospace" fill="#0550ae">insertInlineAddition()</text>
  <text x="52" y="180" font-size="12.5" font-family="ui-monospace, Menlo, monospace" fill="#0550ae">growInlineAddition()</text>
  <text x="52" y="200" font-size="12.5" font-family="ui-monospace, Menlo, monospace" fill="#0550ae">deleteRange()</text>
  <text x="52" y="220" font-size="12.5" font-family="ui-monospace, Menlo, monospace" fill="#0550ae">reconcileEdit()</text>
  <text x="52" y="240" font-size="12.5" font-family="ui-monospace, Menlo, monospace" fill="#0550ae">reconcileFormat()</text>
  <text x="52" y="266" font-size="12" fill="#0a3069">grow* keeps consecutive typing in</text>
  <text x="52" y="283" font-size="12" fill="#0a3069">one marker instead of one per key.</text>

  <line x1="292" y1="194" x2="316" y2="194" stroke="#8c959f" stroke-width="2" marker-end="url(#ar)"/>

  <!-- column 2: resolve -->
  <rect x="322" y="88" width="256" height="212" rx="8" fill="#dafbe1" stroke="#2da44e"/>
  <text x="338" y="114" font-size="14" font-weight="700" fill="#1a7f37">2. Resolve it</text>
  <text x="338" y="134" font-size="12" fill="#1a7f37">The author accepts or rejects.</text>
  <text x="338" y="160" font-size="12.5" font-family="ui-monospace, Menlo, monospace" fill="#0a7b34">acceptInlineAddition()</text>
  <text x="338" y="180" font-size="12.5" font-family="ui-monospace, Menlo, monospace" fill="#0a7b34">rejectInlineAddition()</text>
  <text x="338" y="200" font-size="12.5" font-family="ui-monospace, Menlo, monospace" fill="#0a7b34">acceptInlineDeletion()</text>
  <text x="338" y="220" font-size="12.5" font-family="ui-monospace, Menlo, monospace" fill="#0a7b34">rejectInlineDeletion()</text>
  <text x="338" y="240" font-size="12.5" font-family="ui-monospace, Menlo, monospace" fill="#0a7b34">acceptInlineFormat()</text>
  <text x="338" y="260" font-size="12.5" font-family="ui-monospace, Menlo, monospace" fill="#0a7b34">rejectInlineFormat()</text>
  <text x="338" y="286" font-size="12" fill="#1a7f37">reject(format) restores beforeHTML.</text>

  <line x1="578" y1="194" x2="602" y2="194" stroke="#8c959f" stroke-width="2" marker-end="url(#ar)"/>

  <!-- column 3: strip -->
  <rect x="608" y="88" width="236" height="212" rx="8" fill="#fff8c5" stroke="#d4a72c"/>
  <text x="624" y="114" font-size="14" font-weight="700" fill="#9a6700">3. Strip for output</text>
  <text x="624" y="134" font-size="12" fill="#7d4e00">Readers never see markers.</text>
  <text x="624" y="160" font-size="12.5" font-family="ui-monospace, Menlo, monospace" fill="#9a6700">stripMarkers()</text>
  <text x="624" y="186" font-size="12" fill="#7d4e00">add — hidden until accepted</text>
  <text x="624" y="204" font-size="12" fill="#7d4e00">del — text still renders</text>
  <text x="624" y="222" font-size="12" fill="#7d4e00">format — text still renders</text>
  <text x="624" y="248" font-size="12" fill="#7d4e00">Applied on the front end at</text>
  <text x="624" y="265" font-size="12" fill="#7d4e00">render time and before an</text>
  <text x="624" y="282" font-size="12" fill="#7d4e00">attribute value is captured.</text>

  <!-- worked example -->
  <text x="36" y="342" font-size="12" font-weight="700" fill="#59636e">WORKED EXAMPLE — TYPING OVER A SELECTED WORD</text>

  <rect x="36" y="356" width="808" height="46" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="52" y="376" font-size="11" font-weight="700" fill="#59636e">BEFORE</text>
  <text x="122" y="384" font-size="13.5" font-family="ui-monospace, Menlo, monospace" fill="#1f2328">The quick brown fox</text>

  <rect x="36" y="412" width="808" height="46" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="52" y="432" font-size="11" font-weight="700" fill="#59636e">AFTER</text>
  <text x="122" y="440" font-size="13.5" font-family="ui-monospace, Menlo, monospace" fill="#1f2328">The quick </text>
  <text x="212" y="440" font-size="13.5" font-family="ui-monospace, Menlo, monospace" fill="#82071e" text-decoration="line-through">brown</text>
  <text x="266" y="440" font-size="13.5" font-family="ui-monospace, Menlo, monospace" fill="#0a7b34" text-decoration="underline">red</text>
  <text x="304" y="440" font-size="13.5" font-family="ui-monospace, Menlo, monospace" fill="#1f2328"> fox</text>
  <text x="380" y="440" font-size="12" fill="#59636e">one del marker + one add marker, two notes</text>

  <rect x="36" y="468" width="808" height="86" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="52" y="492" font-size="13" font-weight="700" fill="#1f2328">Why pure transforms</text>
  <text x="52" y="513" font-size="12" fill="#59636e">Because a suggestion is an anchored range re-resolved against current content rather than a stored before/after</text>
  <text x="52" y="530" font-size="12" fill="#59636e">snapshot, edits around a marker do not invalidate it, and two authors can suggest on the same block at once.</text>
  <text x="52" y="547" font-size="12" fill="#59636e">An edit that would straddle an existing marker is declined rather than allowed to corrupt it.</text>
</svg>
