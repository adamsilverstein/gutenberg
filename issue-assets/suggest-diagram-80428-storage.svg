<svg xmlns="http://www.w3.org/2000/svg" width="860" height="620" viewBox="0 0 860 620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="860" height="620" rx="10" fill="#ffffff"/>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,1 L7,4.5 L0,8 z" fill="#8c959f"/>
    </marker>
    <marker id="ao" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,1 L7,4.5 L0,8 z" fill="#bc4c00"/>
    </marker>
  </defs>

  <text x="36" y="40" font-size="18" font-weight="700" fill="#1f2328">How a suggestion gets stored</text>
  <text x="36" y="63" font-size="13" fill="#59636e">The block-editor store is never written. Edits divert to an overlay and land on a note comment.</text>

  <!-- 1 -->
  <rect x="36" y="86" width="450" height="54" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="54" y="110" font-size="14" font-weight="700" fill="#1f2328">Block edit in Suggest mode</text>
  <text x="54" y="129" font-size="12" fill="#59636e">setAttributes() on the block</text>
  <line x1="261" y1="140" x2="261" y2="164" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/>

  <!-- 2 -->
  <rect x="36" y="170" width="450" height="60" rx="8" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="54" y="194" font-size="14" font-weight="700" fill="#0a3069">Suggestion overlay</text>
  <text x="54" y="213" font-size="12" fill="#0a3069">In-memory, keyed by clientId. Baseline snapshot on first edit.</text>
  <line x1="261" y1="230" x2="261" y2="254" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/>

  <!-- 3 -->
  <rect x="36" y="260" width="450" height="54" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="54" y="284" font-size="14" font-weight="700" fill="#1f2328">SuggestionAutoSave</text>
  <text x="54" y="303" font-size="12" fill="#59636e">Debounced, fires after ~1.5s idle on that block</text>
  <line x1="261" y1="314" x2="261" y2="338" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/>

  <!-- 4 -->
  <rect x="36" y="344" width="450" height="54" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="54" y="368" font-size="14" font-weight="700" fill="#1f2328">useSuggestionsProvider</text>
  <text x="54" y="387" font-size="12" fill="#59636e">createSuggestion() / updateSuggestion()</text>
  <line x1="261" y1="398" x2="261" y2="422" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/>

  <!-- 5 -->
  <rect x="36" y="428" width="450" height="54" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="54" y="452" font-size="14" font-weight="700" fill="#1f2328">REST: /wp/v2/comments</text>
  <text x="54" y="471" font-size="12" fill="#59636e">Payload sanitized server-side, size-capped</text>
  <line x1="261" y1="482" x2="261" y2="506" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/>

  <!-- 6 -->
  <rect x="36" y="512" width="450" height="76" rx="8" fill="#dafbe1" stroke="#2da44e"/>
  <text x="54" y="536" font-size="14" font-weight="700" fill="#1a7f37">Note comment + meta</text>
  <text x="54" y="555" font-size="12" fill="#1a7f37">_wp_suggestion — JSON { schemaVersion, operations[] }</text>
  <text x="54" y="573" font-size="12" fill="#1a7f37">_wp_suggestion_status — pending | applied | rejected</text>

  <!-- accept path -->
  <rect x="530" y="170" width="294" height="150" rx="8" fill="#fff8c5" stroke="#d4a72c"/>
  <text x="548" y="196" font-size="14" font-weight="700" fill="#9a6700">Author accepts</text>
  <text x="548" y="219" font-size="12" fill="#7d4e00">applyOperations( attributes, ops )</text>
  <text x="548" y="238" font-size="12" fill="#7d4e00">→ updateBlockAttributes()</text>
  <text x="548" y="262" font-size="12" fill="#7d4e00">This is the one place the store</text>
  <text x="548" y="279" font-size="12" fill="#7d4e00">is written on purpose, so the</text>
  <text x="548" y="296" font-size="12" fill="#7d4e00">interceptor is told to stand down.</text>
  <text x="548" y="313" font-size="12" fill="#7d4e00">Reject just flips the status.</text>
  <path d="M530 250 L500 250 L500 371 L486 371" fill="none" stroke="#bc4c00" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#ao)"/>

  <!-- note -->
  <rect x="530" y="428" width="294" height="160" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="548" y="454" font-size="13" font-weight="700" fill="#1f2328">Why a comment?</text>
  <text x="548" y="477" font-size="12" fill="#59636e">A suggestion is a note that carries</text>
  <text x="548" y="494" font-size="12" fill="#59636e">a payload, so it inherits threading,</text>
  <text x="548" y="511" font-size="12" fill="#59636e">permissions, and the notes sidebar</text>
  <text x="548" y="528" font-size="12" fill="#59636e">for free.</text>
  <text x="548" y="552" font-size="12" fill="#59636e">The provider interface is swappable,</text>
  <text x="548" y="569" font-size="12" fill="#59636e">so storage can move to Yjs later</text>
  <text x="548" y="586" font-size="12" fill="#59636e">without touching the UI.</text>
</svg>
